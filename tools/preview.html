<!doctype html>
<meta charset="utf-8" />
<title>Cutaway model preview</title>
<style>
  html, body { margin: 0; min-width: 100%; min-height: 100%; }
  body { background: #07090d; font: 13px/1.4 system-ui, sans-serif; color: #9aa4b2; }
  body.icon { background: transparent; overflow: hidden; }
  body.icon #hud { display: none; }
  #hud { position: fixed; left: 12px; top: 10px; z-index: 2; }
  button { background: #171b22; color: #cbd3de; border: 1px solid #2a313c; border-radius: 6px; padding: 5px 10px; margin-right: 4px; }
  canvas { display: block; }
</style>
<div id="hud">
  <button data-view="front">front</button>
  <button data-view="left">left</button>
  <button data-view="back">back</button>
  <button data-view="close">close</button>
  <button id="theme">theme</button>
  <span id="label"></span>
</div>
<!-- The addons import three by bare specifier; nothing here bundles, so the
     browser needs to be told where that resolves to. -->
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<script type="module">
  // Reproduces the app's stage — same environment bake, same five lights, same
  // intensities — so what shows up here is what shows up on the phone.
  import * as THREE from 'three';
  import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

  const STAGE = {
    dark: { background: 0x07090d, ambient: 0.16, hemisphere: 0.42, key: 1.5, fill: 0.5, rim: 0.9 },
    light: { background: 0xf4f5f8, ambient: 0.5, hemisphere: 0.75, key: 1.15, fill: 0.4, rim: 0.55 },
  };
  const PARAMS = new URLSearchParams(location.search);
  const ACCENT = PARAMS.get('accent') ?? '#FF7A8A';
  const MODEL = PARAMS.get('model') ?? 'heart';
  const CONTENT_ID = PARAMS.get('id') ?? MODEL.replaceAll('_', '-');
  const ICON_MODE = PARAMS.get('icon') === '1';
  if (ICON_MODE) document.body.classList.add('icon');

  const renderer = new THREE.WebGLRenderer({
    alpha: ICON_MODE,
    antialias: true,
    powerPreference: 'high-performance',
    premultipliedAlpha: true,
    preserveDrawingBuffer: true,
  });
  // A fixed size, not the window's. When the browser pane is not on screen the
  // window reports zero and every captured frame comes back empty.
  const W = ICON_MODE ? 768 : 1000;
  const H = ICON_MODE ? 768 : 760;
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.append(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 80);

  const ambient = new THREE.AmbientLight(0xffffff, 1);
  const hemisphere = new THREE.HemisphereLight(0xdce8ff, 0x0a0d14, 1);
  const key = new THREE.DirectionalLight(0xfff4e8, 1);
  key.position.set(4.2, 6.4, 5.2);
  const fill = new THREE.DirectionalLight(0xc9dcff, 1);
  fill.position.set(-5.2, 1.4, 3.6);
  const rim = new THREE.DirectionalLight(0xffffff, 1);
  rim.position.set(-2.4, 2.8, -6.0);
  scene.add(ambient, hemisphere, key, fill, rim);

  function environment(mode) {
    const width = 32;
    const height = 16;
    const data = new Uint8Array(width * height * 4);
    const sky = new THREE.Color(mode === 'dark' ? '#dfe7f2' : '#ffffff');
    const floor = new THREE.Color(mode === 'dark' ? '#0a0d12' : '#b9c0cb');
    const panelColour = new THREE.Color('#ffffff');
    const mixed = new THREE.Color();
    for (let y = 0; y < height; y += 1) {
      const t = 1 - y / (height - 1);
      for (let x = 0; x < width; x += 1) {
        mixed.copy(floor).lerp(sky, Math.pow(t, 0.55));
        const panel = Math.max(0, 1 - Math.abs(x / width - 0.28) * 7) * Math.max(0, t - 0.25);
        mixed.lerp(panelColour, panel * 0.35);
        const i = (y * width + x) * 4;
        data[i] = mixed.r * 255;
        data[i + 1] = mixed.g * 255;
        data[i + 2] = mixed.b * 255;
        data[i + 3] = 255;
      }
    }
    const source = new THREE.DataTexture(data, width, height);
    source.needsUpdate = true;
    source.mapping = THREE.EquirectangularReflectionMapping;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const target = pmrem.fromEquirectangular(source);
    pmrem.dispose();
    source.dispose();
    return target.texture;
  }

  let mode = 'dark';
  function applyStage() {
    const stage = STAGE[mode];
    renderer.setClearColor(ICON_MODE ? 0x000000 : stage.background, ICON_MODE ? 0 : 1);
    ambient.intensity = stage.ambient;
    hemisphere.intensity = stage.hemisphere;
    key.intensity = stage.key;
    fill.intensity = stage.fill;
    rim.intensity = stage.rim;
    rim.color.set(ACCENT).lerp(new THREE.Color(0xffffff), 0.55);
    scene.environment = environment(mode);
  }
  applyStage();

  // The app rotates every model by its content's restRotation before showing
  // it, and opens on its own default orbit. Rendering the raw .glb from a
  // camera position of my own choosing was checking a view nobody ever sees —
  // the heart's pericardium looked like a thin rim here and covered the whole
  // front on the phone, and this is why.
  const docs = await fetch('/tools/shots/manifest.json').then((r) => r.json()).catch(() => ({}));
  const rest = docs[MODEL]?.restRotation ?? [0, 0, 0];
  const iconView = docs[MODEL]?.icon ?? {};

  const gltf = await new GLTFLoader().loadAsync(`/assets/models/${MODEL}.glb`);
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()).length();
  const centre = box.getCenter(new THREE.Vector3());
  root.position.sub(centre);
  root.scale.setScalar(3.2 / size);
  const pivot = new THREE.Group();
  const iconRotation = iconView.rotation ?? rest;
  pivot.rotation.set(iconRotation[0], iconRotation[1], iconRotation[2]);
  pivot.add(root);
  scene.add(pivot);

  // Resting opacity is a runtime property, not something baked into the .glb,
  // so the preview has to apply it too — otherwise a see-through part looks
  // solid here and see-through on the phone.
  const resting = docs[MODEL]?.opacity ?? {};
  root.traverse((o) => {
    const value = resting[o.name];
    if (!o.isMesh || value === undefined) return;
    o.material.transparent = true;
    o.material.opacity = value;
    o.material.depthWrite = false;
    o.renderOrder = 2;
  });

  let painted = 0;
  root.traverse((o) => { if (o.isMesh && o.geometry.getAttribute('color')) painted += 1; });
  document.getElementById('label').textContent = `${MODEL} · ${painted} painted mesh(es)`;

  // `app` is the orbit the explorer actually opens on: OrbitCamera's home of
  // theta -0.6, phi 1.32. Every other view is for inspection only.
  const orbitDirection = (theta, phi) => (
    [Math.sin(phi) * Math.sin(theta), Math.cos(phi), Math.sin(phi) * Math.cos(theta)]
  );
  const APP_DIR = (() => {
    const theta = -0.6;
    const phi = 1.32;
    return orbitDirection(theta, phi);
  })();
  const ICON_DIR = orbitDirection(iconView.theta ?? -0.6, iconView.phi ?? 1.32);
  const VIEWS = {
    app: APP_DIR.map((v) => v * 4.6),
    behind: APP_DIR.map((v) => -v * 4.6),
    front: [0, 0.2, 4.6],
    left: [4.2, 0.4, 1.6],
    back: [-1.2, 0.3, -4.4],
    close: [0.6, -0.2, 2.3],
  };
  function look(view, distance) {
    const position = ICON_MODE
      ? ICON_DIR.map((value) => value * (distance ?? iconView.distance ?? 4.6))
      : VIEWS[view];
    camera.up.set(0, 1, 0);
    camera.position.set(...position);
    camera.lookAt(0, 0, 0);
    if (ICON_MODE && iconView.roll) camera.rotateZ(iconView.roll);
    renderer.render(scene, camera);
  }
  look('app');

  for (const button of document.querySelectorAll('[data-view]')) {
    button.onclick = () => look(button.dataset.view);
  }
  // Called from the outside when the pane cannot be shown: render each view and
  // post it to the server, which writes it next to the model recipes.
  /** Report or override material state per mesh — for diagnosing, not shipping. */
  window.probe = (patch) => {
    const rows = [];
    root.traverse((o) => {
      if (!o.isMesh) return;
      if (patch) Object.assign(o.material, patch), (o.material.needsUpdate = true);
      rows.push(`${o.name} side=${o.material.side} opacity=${o.material.opacity} transparent=${o.material.transparent} colorAttr=${!!o.geometry.getAttribute('color')}`);
    });
    look('app');
    return rows;
  };

  /** Hide parts by name, so a shell can be taken off without rebuilding. */
  window.hide = (names) => {
    root.traverse((o) => { if (o.isMesh) o.visible = !names.includes(o.name); });
    return names;
  };
  window.capture = async (views = Object.keys(VIEWS), suffix = '') => {
    for (const view of views) {
      look(view);
      await fetch('/shot', { method: 'POST', body: `${MODEL}${suffix}-${mode}-${view}
${renderer.domElement.toDataURL('image/png')}` });
    }
    return views.length;
  };

  const ICON_SIZE = 256;
  const iconCanvas = document.createElement('canvas');
  iconCanvas.width = ICON_SIZE;
  iconCanvas.height = ICON_SIZE;
  const iconContext = iconCanvas.getContext('2d', { alpha: true, willReadFrequently: true });
  if (!iconContext) throw new Error('2D canvas is unavailable for icon export');
  iconContext.imageSmoothingEnabled = true;
  iconContext.imageSmoothingQuality = 'high';

  function alphaBounds() {
    const pixels = iconContext.getImageData(0, 0, ICON_SIZE, ICON_SIZE).data;
    let minX = ICON_SIZE;
    let minY = ICON_SIZE;
    let maxX = -1;
    let maxY = -1;
    for (let y = 0; y < ICON_SIZE; y += 1) {
      for (let x = 0; x < ICON_SIZE; x += 1) {
        if (pixels[(y * ICON_SIZE + x) * 4 + 3] === 0) continue;
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }
    }
    if (maxX < minX || maxY < minY) return null;
    return { minX, minY, maxX, maxY, width: maxX - minX + 1, height: maxY - minY + 1 };
  }

  function drawIcon(distance, shiftX = 0, shiftY = 0) {
    look('app', distance);
    iconContext.clearRect(0, 0, ICON_SIZE, ICON_SIZE);
    iconContext.drawImage(renderer.domElement, shiftX, shiftY, ICON_SIZE, ICON_SIZE);
    return alphaBounds();
  }

  window.captureIcon = async () => {
    if (!ICON_MODE) throw new Error('captureIcon requires ?icon=1');
    const targetPixels = THREE.MathUtils.clamp(iconView.coverage ?? 0.82, 0.7, 0.86) * ICON_SIZE;
    let distance = iconView.distance ?? 4.6;
    let bounds = null;
    for (let pass = 0; pass < 6; pass += 1) {
      bounds = drawIcon(distance);
      if (!bounds) throw new Error(`${MODEL} rendered no visible icon pixels`);
      const occupied = Math.max(bounds.width, bounds.height);
      if (Math.abs(occupied - targetPixels) <= 1) break;
      const correction = THREE.MathUtils.clamp(occupied / targetPixels, 0.65, 1.5);
      distance = THREE.MathUtils.clamp(distance * correction, 1.2, 18);
    }

    bounds = drawIcon(distance);
    const shiftX = Math.round(ICON_SIZE / 2 - (bounds.minX + bounds.maxX + 1) / 2);
    const shiftY = Math.round(ICON_SIZE / 2 - (bounds.minY + bounds.maxY + 1) / 2);
    bounds = drawIcon(distance, shiftX, shiftY);
    if (!bounds) throw new Error(`${MODEL} disappeared while centering its icon`);

    const response = await fetch('/icon', {
      method: 'POST',
      body: `${CONTENT_ID}\n${iconCanvas.toDataURL('image/png')}`,
    });
    if (!response.ok) throw new Error(`icon write failed: ${response.status} ${await response.text()}`);
    return {
      width: ICON_SIZE,
      height: ICON_SIZE,
      bounds,
      distance: Number(distance.toFixed(5)),
      view: {
        rotation: [...iconRotation],
        theta: iconView.theta ?? -0.6,
        phi: iconView.phi ?? 1.32,
        roll: iconView.roll ?? 0,
      },
    };
  };

  document.getElementById('theme').onclick = () => {
    mode = mode === 'dark' ? 'light' : 'dark';
    applyStage();
    renderer.render(scene, camera);
  };

  if (renderer.compileAsync) await renderer.compileAsync(scene, camera);
  look('app');
  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  window.previewReady = true;
</script>
